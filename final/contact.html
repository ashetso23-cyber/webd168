<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yeshi | Portfolio</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />
    <link href="css/styles.css" rel="stylesheet" />

    <!-- favicon -->
    <link rel="icon" href="images/favicon.png" type="image/x-icon" />
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top"
      id="mainNav"
    >
      <div class="container px-4">
        <a
          class="navbar-brand fw-bold fs-3 d-flex align-items-center"
          href="portfolio.html"
        >
          <img
            src="images/logos.png"
            alt="black cat logo"
            width="50"
            height="50"
            class="logo rounded-circle me-2"
          />
          Yeshi
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarResponsive"
          aria-label="Toggle navigation menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarResponsive">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="portfolio.html">Portfolio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="contact.html">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <section class="py-5 mt-5 contact-section">
      <div class="container px-4">
        <div class="row justify-content-center">
          <div class="col-lg-10">
            <div class="text-center mb-5">
              <h1 class="display-5 mb-3">I'd Love to Hear From You</h1>
              <p class="lead text-muted">
                No pressure, no formalities — just a real conversation.
              </p>
            </div>

            <div class="row g-5">
              <!-- Form -->
              <div class="col-lg-7">
                <form id="contactForm">
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <label class="form-label" for="firstName"
                        >First Name</label
                      >
                      <input
                        type="text"
                        class="form-control"
                        id="firstName"
                        name="firstName"
                        required
                      />
                    </div>
                    <div class="col-md-6">
                      <label class="form-label" for="lastName">Last Name</label>
                      <input
                        type="text"
                        class="form-control"
                        id="lastName"
                        name="LastName"
                        required
                      />
                    </div>
                  </div>

                  <div class="mb-3">
                    <label class="form-label" for="email">Email Address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      name="email"
                      required
                    />
                  </div>

                  <div class="mb-4">
                    <label class="form-label" for="message">Message</label>
                    <textarea
                      class="form-control"
                      id="message"
                      name="message"
                      rows="7"
                      placeholder="Drop your thoughts here!"
                      required
                    ></textarea>
                  </div>

                  <div class="text-center">
                    <button type="submit" class="btn btn-primary btn-lg px-5">
                      Send Message
                    </button>
                  </div>
                </form>
              </div>

              <!-- Personal Right Side -->
              <div class="col-lg-5">
                <div class="frame-container mx-auto" style="max-width: 340px">
                  <div class="art-frame mx-auto" style="max-width: 340px">
                    <img
                      src="images/birds.webp"
                      class="img-fluid rounded-3 hearts-image"
                      alt="Birds forming a heart shape - artistic abstract piece"
                      style="width: 100%"
                    />
                  </div>

                  <div class="quote-box mt-4 p-4">
                    <p class="fs-5 text-muted mb-2">
                      "Creativity is contagious. Let's make something beautiful
                      together."
                    </p>
                    <p class="text-muted small text-end mb-0">— Yeshi</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="py-5 bg-dark text-white text-center">
      <div class="container">
        <div
          class="d-flex flex-wrap justify-content-center align-items-center gap-4"
        >
          <div class="mb-3 mb-md-0">
            <a href="#" class="text-white mx-3 fs-2" aria-label="GitHub Profile"
              ><i class="bi bi-github"></i
            ></a>
            <a
              href="#"
              class="text-white mx-3 fs-2"
              aria-label="LinkedIn Profile"
              ><i class="bi bi-linkedin"></i
            ></a>
            <a
              href="#"
              class="text-white mx-3 fs-2"
              aria-label="Instagram Profile"
              ><i class="bi bi-instagram"></i
            ></a>
          </div>
          <p class="mb-0">
            Copyright © <span id="year"></span> Yeshi • Web Development 168
          </p>
        </div>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/scripts.js"></script>
  </body>
</html>
